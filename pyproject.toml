[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oif-cyber-intelligence"
version = "0.1.0"
description = "Defensive IOC normalization with source-preserving records."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.scripts]
oif-ioc-normalize = "oif_cyber.ioc:main"

[tool.setuptools.packages.find]
where = ["src"]
